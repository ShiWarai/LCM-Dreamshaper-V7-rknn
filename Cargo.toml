[package]
name = "lcm-dreamshaper-v7-rs"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0"
axum = "0.8"
base64 = "0.22"
bytemuck = "1"
clap = { version = "4", features = ["derive"] }
dirs = "5"
hf-hub = "0.3"
image = "0.25"
rand = "0.8"
rand_distr = "0.4"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "rustls-tls"] }
rknn-rs = "0.2.4"
rmcp = { version = "0.9.1", features = ["server", "macros", "transport-streamable-http-server", "transport-streamable-http-server-session"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net"] }
tokenizers = { version = "0.21", default-features = false, features = ["onig"] }
tower = "0.5"
tower-http = { version = "0.6", features = ["cors", "trace", "fs"] }

[profile.release]
opt-level = 3

[lib]
name = "lcm_dreamshaper_v7_rs"
path = "src/lib.rs"

[[bin]]
name = "dreamshaper-cli"
path = "src/main.rs"
